name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:fulltext
      - run: npm run build
      - run: npm run release:prepare
      - name: Publish installation package and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag does not match package.json version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its published assets."
            exit 0
          fi
          gh release create "$tag" build/release/* \
            --target "$GITHUB_SHA" \
            --title "Zotero Full-Text Translate ${version}" \
            --notes-file RELEASE_NOTES.md \
            --latest
